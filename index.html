<!DOCTYPE html>
<html>
<head>
  <title>Mi página</title>
</head>
<body>

<h1 id="texto">Hola</h1>

<!-- Botón 1 -->
<button onclick="cambiarTexto()">
  Cambiar texto
</button>

<!-- Botón 2 -->
<button onclick="cambiarColor()">
  Cambiar color
</button>

<!-- Botón 3 -->
<button onclick="irGoogle()">
  Ir a Google
</button>

<script>
  function cambiarTexto() {
    document.getElementById("texto").innerText = "¡El texto cambió!";
  }

  function cambiarColor() {
    document.body.style.backgroundColor = "lightblue";
  }

  function irGoogle() {
    window.location.href = "https://google.com";
  }
</script>

</body>
